name: Build APK

on:
  push:
  workflow_dispatch:
    inputs:
      skip_emulator:
        description: "Release without the emulator test (only if the emulator itself is broken)"
        type: boolean
        default: false

permissions:
  contents: write # lets the job publish the APK as a release download

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.sign.outputs.stable }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # GitHub's Ubuntu runners ship with the Android SDK (ANDROID_HOME); the Android Gradle
      # plugin downloads the exact platform/build-tools it needs.
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - uses: gradle/actions/setup-gradle@v4

      # Full vendor tables (IEEE MAC prefixes, Bluetooth SIG companies/UUIDs) for device labels.
      # Never fails the build; the app has small built-in tables as a fallback.
      - name: Fetch vendor databases
        run: python3 tools/fetch_vendor_db.py app/src/main/assets || true

      # Same key every build => the app can update itself. The key is derived from ONE secret,
      # AIRSCOPE_SIGNING_SEED (a long passphrase you choose). It is never stored in the repo.
      # Without the secret, a one-time key is used and the in-app updater can't install that build.
      - name: Prepare signing key
        id: sign
        env:
          SEED: ${{ secrets.AIRSCOPE_SIGNING_SEED }}
        run: |
          KS="$RUNNER_TEMP/airscope.p12"
          if [ -n "$SEED" ]; then
            python3 -m pip install --quiet "cryptography>=42"
            PASS="$(AIRSCOPE_SIGNING_SEED="$SEED" python3 tools/derive_signing_key.py "$KS")"
            echo "::add-mask::$PASS"
            echo "Signing with the key derived from AIRSCOPE_SIGNING_SEED"
            echo "AIRSCOPE_STABLE_KEY=1" >> "$GITHUB_ENV"
            echo "stable=1" >> "$GITHUB_OUTPUT"
          else
            PASS="$(openssl rand -hex 16)"
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias airscope -keyalg RSA \
              -keysize 3072 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=AirScope Personal"
            echo "::warning::AIRSCOPE_SIGNING_SEED secret not set: this build uses a one-time key, so it can't auto-update. See README."
            echo "AIRSCOPE_STABLE_KEY=0" >> "$GITHUB_ENV"
            echo "stable=0" >> "$GITHUB_OUTPUT"
          fi
          echo "AIRSCOPE_KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "AIRSCOPE_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"

      # Pure-logic suites (placement, GPS filter, heading fusion, parsers, tiles): a failing test stops the release.
      - name: Logic tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testReleaseUnitTest || { echo "== failing checks =="; grep -rh "^FAIL " app/build/test-results/ | head -40; exit 1; }
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          t = f = 0
          for x in glob.glob("app/build/test-results/**/*.xml", recursive=True):
              r = ET.parse(x).getroot(); t += int(r.get("tests", 0)); f += int(r.get("failures", 0)) + int(r.get("errors", 0))
          print(f"JUnit: {t} suites, {f} failed"); open("test-summary.txt", "w").write(f"logic suites: {t}, failed: {f}\n")
          EOF

      - name: Build APK
        env:
          AIRSCOPE_VERSION_CODE: ${{ github.run_number }}
        run: |
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk AirScope.apk

      - name: Show signing certificate
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs AirScope.apk | grep -i sha-256 || true

      - uses: actions/upload-artifact@v4
        with:
          name: AirScope-apk
          path: AirScope.apk

  # Runs the APK on an Android 15 emulator like a person would (permissions, GPS walking + highway driving,
  # every main screen, web HUD, screen off). A build that crashes or freezes is never released, so the
  # phone's auto-updater can't install a broken AirScope.
  emulator-test:
    needs: build
    if: ${{ !inputs.skip_emulator }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: AirScope-apk

      - name: Enable KVM (hardware-accelerated emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run AirScope on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/emulator_smoke.sh AirScope.apk emulator-report

      - name: Summary
        if: always()
        run: cat emulator-report/summary.txt >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-report
          path: emulator-report

  # The app's updater reads the latest *full* release. Builds signed with a one-time key are published
  # as pre-releases, so the updater never offers a build it can't install.
  publish:
    needs: [build, emulator-test]
    # Only the main branch releases; other branches just build and run the emulator test.
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.build.result == 'success' && (needs.emulator-test.result == 'success' || needs.emulator-test.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AirScope-apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AIRSCOPE_STABLE_KEY: ${{ needs.build.outputs.stable }}
        run: |
          if [ "$AIRSCOPE_STABLE_KEY" = "1" ]; then
            gh release create "build-${{ github.run_number }}" AirScope.apk --target "${{ github.sha }}" \
              --title "AirScope build ${{ github.run_number }}" \
              --notes "Built from ${{ github.sha }} and tested on an Android 15 emulator. Signed with your stable key: the app installs this by itself, or tap AirScope.apk to install manually."
          else
            gh release create "build-${{ github.run_number }}" AirScope.apk --prerelease --target "${{ github.sha }}" \
              --title "AirScope build ${{ github.run_number }} (one-time key)" \
              --notes "Built from ${{ github.sha }}. Signed with a ONE-TIME key because the AIRSCOPE_SIGNING_SEED secret isn't set, so it can't auto-update. To install: uninstall AirScope, then tap AirScope.apk."
          fi
