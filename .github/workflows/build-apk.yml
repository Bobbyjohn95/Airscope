name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write # lets the job publish the APK as a release download

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu runners ship with the Android SDK (ANDROID_HOME); the Android Gradle
      # plugin downloads the exact platform/build-tools it needs.
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - uses: gradle/actions/setup-gradle@v4

      # Uses your own key if the AIRSCOPE_KEYSTORE_B64 / AIRSCOPE_KEYSTORE_PASSWORD repository
      # secrets exist (same key every build = updates install over each other). Otherwise a
      # throwaway key is generated for this run (uninstall the old build before installing).
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.AIRSCOPE_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.AIRSCOPE_KEYSTORE_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/airscope.jks"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            PASS="$KS_PASS"
            echo "Signing with your saved key"
          else
            PASS="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias airscope -keyalg RSA \
              -keysize 3072 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=AirScope Personal"
            echo "::warning::No signing secrets set: signed with a one-time key. Uninstall the previous AirScope before installing this build."
          fi
          echo "::add-mask::$PASS"
          echo "AIRSCOPE_KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "AIRSCOPE_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk AirScope.apk

      - name: Show signing certificate
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs AirScope.apk | grep -i sha-256 || true

      - uses: actions/upload-artifact@v4
        with:
          name: AirScope-apk
          path: AirScope.apk

      # Phone-friendly: the APK appears under the repo's "Releases" as a direct .apk download.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" AirScope.apk \
            --title "AirScope build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. Open on the Pixel and tap AirScope.apk to install."
