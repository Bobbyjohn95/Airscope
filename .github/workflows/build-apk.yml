name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write # lets the job publish the APK as a release download

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # GitHub's Ubuntu runners ship with the Android SDK (ANDROID_HOME); the Android Gradle
      # plugin downloads the exact platform/build-tools it needs.
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - uses: gradle/actions/setup-gradle@v4

      # Full vendor tables (IEEE MAC prefixes, Bluetooth SIG companies/UUIDs) for device labels.
      # Never fails the build; the app has small built-in tables as a fallback.
      - name: Fetch vendor databases
        run: python3 tools/fetch_vendor_db.py app/src/main/assets || true

      # Same key every build => the app can update itself. The key is derived from ONE secret,
      # AIRSCOPE_SIGNING_SEED (a long passphrase you choose). It is never stored in the repo.
      # Without the secret, a one-time key is used and the in-app updater can't install that build.
      - name: Prepare signing key
        env:
          SEED: ${{ secrets.AIRSCOPE_SIGNING_SEED }}
        run: |
          KS="$RUNNER_TEMP/airscope.p12"
          if [ -n "$SEED" ]; then
            python3 -m pip install --quiet "cryptography>=42"
            PASS="$(AIRSCOPE_SIGNING_SEED="$SEED" python3 tools/derive_signing_key.py "$KS")"
            echo "::add-mask::$PASS"
            echo "Signing with the key derived from AIRSCOPE_SIGNING_SEED"
          else
            PASS="$(openssl rand -hex 16)"
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias airscope -keyalg RSA \
              -keysize 3072 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=AirScope Personal"
            echo "::warning::AIRSCOPE_SIGNING_SEED secret not set: this build uses a one-time key, so it can't auto-update. See README."
          fi
          echo "AIRSCOPE_KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "AIRSCOPE_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          AIRSCOPE_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk AirScope.apk

      - name: Show signing certificate
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs AirScope.apk | grep -i sha-256 || true

      - uses: actions/upload-artifact@v4
        with:
          name: AirScope-apk
          path: AirScope.apk

      # The app's updater reads this release. Phone-friendly: tap AirScope.apk to install manually.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" AirScope.apk \
            --title "AirScope build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. Open on the Pixel and tap AirScope.apk to install, or let the app update itself."
